server:
  port: ${SERVER_PORT:8102}
spring:
  application:
    name: restaurant-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/restaurant_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  cloud:
    openfeign:
      client:
        config:
          user-service:
            connectTimeout: 3000
            readTimeout: 5000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE:10485760}
      max-request-size: ${STORAGE_MAX_FILE_SIZE:10485760}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/food-delivery}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
security:
  jwt:
    audience: ${KEYCLOAK_AUDIENCE:food-delivery-api}
app:
  internal-api:
    key: ${INTERNAL_API_KEY:}
  system-role-sync:
    enabled: ${SYSTEM_ROLE_SYNC_ENABLED:true}
    fixed-delay-ms: ${SYSTEM_ROLE_SYNC_FIXED_DELAY_MS:5000}
    max-retries: ${SYSTEM_ROLE_SYNC_MAX_RETRIES:10}
    initial-retry-delay-ms: ${SYSTEM_ROLE_SYNC_INITIAL_RETRY_DELAY_MS:5000}
    max-retry-delay-ms: ${SYSTEM_ROLE_SYNC_MAX_RETRY_DELAY_MS:60000}
  outbox:
    topic: ${RESTAURANT_EVENTS_TOPIC:restaurant.events}
    topic-partitions: ${RESTAURANT_EVENTS_TOPIC_PARTITIONS:3}
    topic-replication-factor: ${RESTAURANT_EVENTS_TOPIC_REPLICATION_FACTOR:1}
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay-ms: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS:1000}
      batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:50}
      max-retries: ${OUTBOX_PUBLISHER_MAX_RETRIES:10}
      send-timeout-ms: ${OUTBOX_PUBLISHER_SEND_TIMEOUT_MS:5000}
      processing-lease-ms: ${OUTBOX_PUBLISHER_PROCESSING_LEASE_MS:30000}
      initial-retry-delay-ms: ${OUTBOX_PUBLISHER_INITIAL_RETRY_DELAY_MS:5000}
      max-retry-delay-ms: ${OUTBOX_PUBLISHER_MAX_RETRY_DELAY_MS:60000}
  search-reindex:
    batch-size: ${SEARCH_REINDEX_BATCH_SIZE:100}
  storage:
    provider: ${STORAGE_PROVIDER:CLOUDINARY}
    max-file-size: ${STORAGE_MAX_FILE_SIZE:10485760}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - application/pdf
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      base-folder: ${CLOUDINARY_BASE_FOLDER:food-delivery/restaurant-documents}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style-access: ${S3_PATH_STYLE_ACCESS:false}
      base-folder: ${S3_BASE_FOLDER:restaurant-documents}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
