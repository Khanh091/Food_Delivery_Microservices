spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/catalog_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  cloud:
    openfeign:
      client:
        config:
          restaurant-service:
            connectTimeout: 3000
            readTimeout: 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/food-delivery}
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE:10485760}
      max-request-size: ${STORAGE_MAX_FILE_SIZE:10485760}

app:
  storage:
    max-file-size: ${STORAGE_MAX_FILE_SIZE:10485760}
    allowed-content-types: image/jpeg,image/png,image/webp
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      base-folder: ${CLOUDINARY_BASE_FOLDER:food-delivery/catalog-items}

server:
  port: ${SERVER_PORT:8103}

security:
  jwt:
    audience: ${KEYCLOAK_AUDIENCE:food-delivery-api}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
