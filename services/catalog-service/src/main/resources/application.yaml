spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/catalog_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  cloud:
    openfeign:
      client:
        config:
          restaurant-service:
            connectTimeout: 3000
            readTimeout: 5000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 0
      properties:
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:5000}
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:10000}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/food-delivery}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE:10485760}
      max-request-size: ${STORAGE_MAX_FILE_SIZE:10485760}

app:
  outbox:
    topic: ${CATALOG_EVENTS_TOPIC:catalog.events}
    topic-partitions: ${CATALOG_EVENTS_TOPIC_PARTITIONS:3}
    topic-replication-factor: ${CATALOG_EVENTS_TOPIC_REPLICATION_FACTOR:1}
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:1000}
      batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:50}
      max-retries: ${OUTBOX_PUBLISHER_MAX_RETRIES:10}
      send-timeout-ms: ${OUTBOX_PUBLISHER_SEND_TIMEOUT_MS:15000}
      processing-lease-ms: ${OUTBOX_PUBLISHER_PROCESSING_LEASE_MS:30000}
      initial-retry-delay-ms: ${OUTBOX_PUBLISHER_INITIAL_RETRY_DELAY_MS:5000}
      max-retry-delay-ms: ${OUTBOX_PUBLISHER_MAX_RETRY_DELAY_MS:60000}
  search-reindex:
    batch-size: ${CATALOG_SEARCH_REINDEX_BATCH_SIZE:100}
  storage:
    max-file-size: ${STORAGE_MAX_FILE_SIZE:10485760}
    allowed-content-types: image/jpeg,image/png,image/webp
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      base-folder: ${CLOUDINARY_BASE_FOLDER:food-delivery/catalog-items}

server:
  port: ${SERVER_PORT:8103}

security:
  jwt:
    audience: ${KEYCLOAK_AUDIENCE:food-delivery-api}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

management:
  health:
    kafka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
