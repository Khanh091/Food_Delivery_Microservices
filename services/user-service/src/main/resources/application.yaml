server:
  port: ${SERVER_PORT:8101}

spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/user_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: ${USER_AVATAR_MAX_FILE_SIZE:5242880}
      max-request-size: ${USER_AVATAR_MAX_FILE_SIZE:5242880}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/food-delivery}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

security:
  jwt:
    audience: ${KEYCLOAK_AUDIENCE:food-delivery-api}

app:
  internal-api:
    key: ${INTERNAL_API_KEY:}
  keycloak-admin:
    base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8180}
    realm: ${KEYCLOAK_ADMIN_REALM:food-delivery}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
  avatar-storage:
    max-file-size: ${USER_AVATAR_MAX_FILE_SIZE:5242880}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      base-folder: ${USER_AVATAR_CLOUDINARY_BASE_FOLDER:food-delivery/avatars}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always
