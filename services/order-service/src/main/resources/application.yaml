spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    admin:
      fail-fast: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/food-delivery}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
  cloud:
    openfeign:
      client:
        config:
          cart-service:
            connectTimeout: 3000
            readTimeout: 5000
          user-service:
            connectTimeout: 3000
            readTimeout: 5000
          catalog-service:
            connectTimeout: 3000
            readTimeout: 5000
          restaurant-service:
            connectTimeout: 3000
            readTimeout: 5000

server:
  port: ${SERVER_PORT:8106}

security:
  jwt:
    audience: ${KEYCLOAK_AUDIENCE:food-delivery-api}

app:
  internal-api:
    key: ${INTERNAL_API_KEY:}
  outbox:
    topic: ${ORDER_CONFIRMED_TOPIC:order.lifecycle.v1}
    topic-partitions: ${ORDER_CONFIRMED_TOPIC_PARTITIONS:3}
    topic-replication-factor: ${ORDER_CONFIRMED_TOPIC_REPLICATION_FACTOR:1}
    publisher:
      enabled: ${ORDER_OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay-ms: ${ORDER_OUTBOX_PUBLISHER_FIXED_DELAY_MS:1000}
      batch-size: ${ORDER_OUTBOX_PUBLISHER_BATCH_SIZE:50}
      send-timeout-ms: ${ORDER_OUTBOX_PUBLISHER_SEND_TIMEOUT_MS:5000}
      processing-lease-ms: ${ORDER_OUTBOX_PUBLISHER_PROCESSING_LEASE_MS:30000}
      retry-delay-ms: ${ORDER_OUTBOX_PUBLISHER_RETRY_DELAY_MS:5000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
