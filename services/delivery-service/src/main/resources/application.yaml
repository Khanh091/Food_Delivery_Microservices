spring:
  application:
    name: delivery-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

server:
  port: ${SERVER_PORT:8107}

security:
  jwt:
    audience: ${KEYCLOAK_AUDIENCE:food-delivery-api}
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/food-delivery}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/food-delivery/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

delivery:
  geocoding:
    provider: ${DELIVERY_GEOCODING_PROVIDER:google}
    api-key: ${DELIVERY_GEOCODING_API_KEY:}
    google-base-url: ${DELIVERY_GOOGLE_GEOCODING_BASE_URL:https://maps.googleapis.com}
