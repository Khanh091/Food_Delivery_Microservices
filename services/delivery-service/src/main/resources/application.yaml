spring:
  application:
    name: delivery-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/delivery_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8107}

security:
  jwt:
    audience: ${KEYCLOAK_AUDIENCE:food-delivery-api}
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/food-delivery}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/food-delivery/protocol/openid-connect/certs}

app:
  internal-api:
    key: ${INTERNAL_API_KEY:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

management:
  health:
    redis:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

delivery:
  offer:
    ttl: ${DELIVERY_OFFER_TTL:45s}
  dispatch:
    search-radii-meters: ${DELIVERY_DISPATCH_SEARCH_RADII_METERS:2000,4000,6000,8000}
    candidates-per-radius: ${DELIVERY_DISPATCH_CANDIDATES_PER_RADIUS:20}
  vietmap:
    service-key: ${DELIVERY_VIETMAP_SERVICE_KEY:}
    api-base-url: ${DELIVERY_VIETMAP_API_BASE_URL:https://maps.vietmap.vn}
    display-type: ${DELIVERY_VIETMAP_DISPLAY_TYPE:5}
  routing:
    vehicle: ${DELIVERY_VIETMAP_ROUTE_VEHICLE:car}
  quote:
    ttl: ${DELIVERY_QUOTE_TTL:5m}
    currency: ${DELIVERY_QUOTE_CURRENCY:VND}
    # Explicit global DEV/MVP policy; replace with managed rule storage later.
    base-fee: ${DELIVERY_BASE_FEE:15000}
    included-distance-meters: ${DELIVERY_INCLUDED_DISTANCE_METERS:3000}
    fee-per-km: ${DELIVERY_FEE_PER_KM:5000}
    maximum-service-distance-meters: ${DELIVERY_MAXIMUM_SERVICE_DISTANCE_METERS:10000}
    pricing-policy-version: ${DELIVERY_PRICING_POLICY_VERSION:dev-v1}
  checkout-location:
    ttl: ${DELIVERY_CHECKOUT_LOCATION_TTL:45m}
