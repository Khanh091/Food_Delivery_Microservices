spring:
  application:
    name: delivery-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/delivery_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    admin:
      fail-fast: false

server:
  port: ${SERVER_PORT:8107}

security:
  jwt:
    audience: ${KEYCLOAK_AUDIENCE:food-delivery-api}
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/food-delivery}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/food-delivery/protocol/openid-connect/certs}

app:
  internal-api:
    key: ${INTERNAL_API_KEY:}
  kafka:
    order-confirmed-topic: ${ORDER_CONFIRMED_TOPIC:order.lifecycle.v1}
    order-confirmed-dlt-topic: ${ORDER_CONFIRMED_DLT_TOPIC:order.lifecycle.v1.DLT}
    consumer-group: ${ORDER_CONFIRMED_CONSUMER_GROUP:delivery-service-order-lifecycle}
    retry-backoff-ms: ${ORDER_CONFIRMED_RETRY_BACKOFF_MS:1000}
    retry-max-attempts: ${ORDER_CONFIRMED_RETRY_MAX_ATTEMPTS:3}
  outbox:
    topic: ${DELIVERY_LIFECYCLE_TOPIC:delivery.lifecycle.v1}
    topic-partitions: ${DELIVERY_LIFECYCLE_TOPIC_PARTITIONS:3}
    topic-replication-factor: ${DELIVERY_LIFECYCLE_TOPIC_REPLICATION_FACTOR:1}
    publisher:
      enabled: ${DELIVERY_OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay-ms: ${DELIVERY_OUTBOX_PUBLISHER_DELAY_MS:1000}
      batch-size: ${DELIVERY_OUTBOX_PUBLISHER_BATCH_SIZE:50}
      send-timeout-ms: ${DELIVERY_OUTBOX_PUBLISHER_SEND_TIMEOUT_MS:5000}
      processing-lease-ms: ${DELIVERY_OUTBOX_PUBLISHER_LEASE_MS:30000}
      retry-delay-ms: ${DELIVERY_OUTBOX_PUBLISHER_RETRY_DELAY_MS:5000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

management:
  health:
    redis:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

delivery:
  offer:
    ttl: ${DELIVERY_OFFER_TTL:45s}
  dispatch:
    search-radii-meters: ${DELIVERY_DISPATCH_SEARCH_RADII_METERS:2000,4000,6000,8000}
    candidates-per-radius: ${DELIVERY_DISPATCH_CANDIDATES_PER_RADIUS:20}
    retry-delay: ${DELIVERY_DISPATCH_RETRY_DELAY:15s}
    max-duration: ${DELIVERY_DISPATCH_MAX_DURATION:10m}
    scheduler-delay: ${DELIVERY_DISPATCH_SCHEDULER_DELAY:5000}
  vietmap:
    service-key: ${DELIVERY_VIETMAP_SERVICE_KEY:}
    api-base-url: ${DELIVERY_VIETMAP_API_BASE_URL:https://maps.vietmap.vn}
    display-type: ${DELIVERY_VIETMAP_DISPLAY_TYPE:5}
  routing:
    vehicle: ${DELIVERY_VIETMAP_ROUTE_VEHICLE:car}
  quote:
    ttl: ${DELIVERY_QUOTE_TTL:5m}
    currency: ${DELIVERY_QUOTE_CURRENCY:VND}
    # Explicit global DEV/MVP policy; replace with managed rule storage later.
    base-fee: ${DELIVERY_BASE_FEE:15000}
    included-distance-meters: ${DELIVERY_INCLUDED_DISTANCE_METERS:3000}
    fee-per-km: ${DELIVERY_FEE_PER_KM:5000}
    maximum-service-distance-meters: ${DELIVERY_MAXIMUM_SERVICE_DISTANCE_METERS:10000}
    pricing-policy-version: ${DELIVERY_PRICING_POLICY_VERSION:dev-v1}
  checkout-location:
    ttl: ${DELIVERY_CHECKOUT_LOCATION_TTL:45m}
