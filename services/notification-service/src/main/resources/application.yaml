spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    admin:
      fail-fast: false

server:
  port: ${SERVER_PORT:8112}

security:
  jwt:
    audience: ${KEYCLOAK_AUDIENCE:food-delivery-api}
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/food-delivery}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/food-delivery/protocol/openid-connect/certs}

app:
  kafka:
    delivery-lifecycle-topic: ${DELIVERY_LIFECYCLE_TOPIC:delivery.lifecycle.v1}
    delivery-lifecycle-dlt-topic: ${DELIVERY_LIFECYCLE_DLT_TOPIC:delivery.lifecycle.v1.DLT}
    delivery-lifecycle-consumer-group: ${DELIVERY_LIFECYCLE_CONSUMER_GROUP:notification-service-delivery-lifecycle}
    retry-backoff-ms: ${DELIVERY_LIFECYCLE_RETRY_BACKOFF_MS:1000}
    retry-max-attempts: ${DELIVERY_LIFECYCLE_RETRY_MAX_ATTEMPTS:3}

notification:
  expo:
    base-url: ${EXPO_PUSH_BASE_URL:https://exp.host/--/api/v2}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
