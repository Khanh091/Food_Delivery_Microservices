spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    admin:
      fail-fast: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/food-delivery}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/food-delivery/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8109}

security:
  jwt:
    audience: ${KEYCLOAK_AUDIENCE:food-delivery-api}

app:
  internal-api:
    key: ${INTERNAL_API_KEY:}
  outbox:
    topic: ${PAYMENT_LIFECYCLE_TOPIC:payment.lifecycle.v1}
    topic-partitions: ${PAYMENT_LIFECYCLE_TOPIC_PARTITIONS:3}
    topic-replication-factor: ${PAYMENT_LIFECYCLE_TOPIC_REPLICATION_FACTOR:1}
    publisher:
      enabled: ${PAYMENT_OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay-ms: ${PAYMENT_OUTBOX_PUBLISHER_FIXED_DELAY_MS:1000}
      batch-size: ${PAYMENT_OUTBOX_PUBLISHER_BATCH_SIZE:50}
      send-timeout-ms: ${PAYMENT_OUTBOX_PUBLISHER_SEND_TIMEOUT_MS:5000}
      processing-lease-ms: ${PAYMENT_OUTBOX_PUBLISHER_PROCESSING_LEASE_MS:30000}
      retry-delay-ms: ${PAYMENT_OUTBOX_PUBLISHER_RETRY_DELAY_MS:5000}

payment:
  mock:
    webhook-secret: ${PAYMENT_MOCK_WEBHOOK_SECRET:dev-mock-secret}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
