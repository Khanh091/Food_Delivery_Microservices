name: food_delivery_microservices
services:
  postgres:
    image: postgres:17
    container_name: food-delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.1
    container_name: food-delivery-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: food-delivery-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s

  redis:
    image: redis:7.4-alpine
    container_name: food-delivery-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: food-delivery-keycloak
    restart: unless-stopped

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

    command:
      - start-dev
      - --import-realm

    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"

    volumes:
      - ./infrastructure/keycloak/realms:/opt/keycloak/data/import:ro
      - ./infrastructure/keycloak/themes:/opt/keycloak/themes:ro

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - food-delivery-network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c '{ printf "HEAD /health/ready HTTP/1.0\r\n\r\n" >&0;
          grep -q " 200 "; } 0<>/dev/tcp/127.0.0.1/9000'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  discovery-service:
    build:
      context: ./platform/discovery-service
      dockerfile: Dockerfile
    container_name: food-delivery-discovery
    restart: unless-stopped
    environment:
      SERVER_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: discovery-service
    ports:
      - "${DISCOVERY_PORT:-8761}:8761"
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  api-gateway:
    build:
      context: ./platform/api-gateway
      dockerfile: Dockerfile
    container_name: food-delivery-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/food-delivery
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/food-delivery/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-food-delivery-api}
    ports:
      - "${API_GATEWAY_PORT:-8081}:8081"
    depends_on:
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: food-delivery-user-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8101
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: user-service
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/food-delivery
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/food-delivery/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-food-delivery-api}
      USER_AVATAR_MAX_FILE_SIZE: ${USER_AVATAR_MAX_FILE_SIZE:-5242880}
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM:-food-delivery}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      USER_AVATAR_CLOUDINARY_BASE_FOLDER: ${USER_AVATAR_CLOUDINARY_BASE_FOLDER:-food-delivery/avatars}
    ports:
      - "${USER_SERVICE_PORT:-8101}:8101"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8101/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  restaurant-service:
    build:
      context: ./services/restaurant-service
      dockerfile: Dockerfile
    container_name: food-delivery-restaurant-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8102
      DB_URL: jdbc:postgresql://postgres:5432/restaurant_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: restaurant-service
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/food-delivery
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/food-delivery/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-food-delivery-api}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-CLOUDINARY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      SYSTEM_ROLE_SYNC_ENABLED: ${SYSTEM_ROLE_SYNC_ENABLED:-true}
      SYSTEM_ROLE_SYNC_FIXED_DELAY_MS: ${SYSTEM_ROLE_SYNC_FIXED_DELAY_MS:-5000}
      SYSTEM_ROLE_SYNC_MAX_RETRIES: ${SYSTEM_ROLE_SYNC_MAX_RETRIES:-10}
      SYSTEM_ROLE_SYNC_INITIAL_RETRY_DELAY_MS: ${SYSTEM_ROLE_SYNC_INITIAL_RETRY_DELAY_MS:-5000}
      SYSTEM_ROLE_SYNC_MAX_RETRY_DELAY_MS: ${SYSTEM_ROLE_SYNC_MAX_RETRY_DELAY_MS:-60000}
      STORAGE_MAX_FILE_SIZE: ${STORAGE_MAX_FILE_SIZE:-10485760}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_BASE_FOLDER: ${CLOUDINARY_BASE_FOLDER:-food-delivery/restaurant-documents}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-false}
      S3_BASE_FOLDER: ${S3_BASE_FOLDER:-restaurant-documents}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RESTAURANT_EVENTS_TOPIC: ${RESTAURANT_EVENTS_TOPIC:-restaurant.events}
      RESTAURANT_EVENTS_TOPIC_PARTITIONS: ${RESTAURANT_EVENTS_TOPIC_PARTITIONS:-3}
      RESTAURANT_EVENTS_TOPIC_REPLICATION_FACTOR: ${RESTAURANT_EVENTS_TOPIC_REPLICATION_FACTOR:-1}
      SEARCH_REINDEX_BATCH_SIZE: ${RESTAURANT_SEARCH_REINDEX_BATCH_SIZE:-100}
    ports:
      - "${RESTAURANT_SERVICE_PORT:-8102}:8102"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8102/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: food-delivery-catalog-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8103
      DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: catalog-service
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/food-delivery
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/food-delivery/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-food-delivery-api}
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CATALOG_EVENTS_TOPIC: ${CATALOG_EVENTS_TOPIC:-catalog.events}
      CATALOG_EVENTS_TOPIC_PARTITIONS: ${CATALOG_EVENTS_TOPIC_PARTITIONS:-3}
      CATALOG_EVENTS_TOPIC_REPLICATION_FACTOR: ${CATALOG_EVENTS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_REQUEST_TIMEOUT_MS: ${KAFKA_REQUEST_TIMEOUT_MS:-5000}
      KAFKA_DELIVERY_TIMEOUT_MS: ${KAFKA_DELIVERY_TIMEOUT_MS:-10000}
      OUTBOX_PUBLISHER_DELAY_MS: ${OUTBOX_PUBLISHER_DELAY_MS:-1000}
      OUTBOX_PUBLISHER_BATCH_SIZE: ${OUTBOX_PUBLISHER_BATCH_SIZE:-50}
      OUTBOX_PUBLISHER_MAX_RETRIES: ${OUTBOX_PUBLISHER_MAX_RETRIES:-10}
      OUTBOX_PUBLISHER_SEND_TIMEOUT_MS: ${OUTBOX_PUBLISHER_SEND_TIMEOUT_MS:-15000}
      OUTBOX_PUBLISHER_PROCESSING_LEASE_MS: ${OUTBOX_PUBLISHER_PROCESSING_LEASE_MS:-30000}
      OUTBOX_PUBLISHER_INITIAL_RETRY_DELAY_MS: ${OUTBOX_PUBLISHER_INITIAL_RETRY_DELAY_MS:-5000}
      OUTBOX_PUBLISHER_MAX_RETRY_DELAY_MS: ${OUTBOX_PUBLISHER_MAX_RETRY_DELAY_MS:-60000}
      CATALOG_SEARCH_REINDEX_BATCH_SIZE: ${CATALOG_SEARCH_REINDEX_BATCH_SIZE:-100}
      STORAGE_MAX_FILE_SIZE: ${STORAGE_MAX_FILE_SIZE:-10485760}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_BASE_FOLDER: ${CATALOG_CLOUDINARY_BASE_FOLDER:-food-delivery/catalog-items}
    ports:
      - "${CATALOG_SERVICE_PORT:-8103}:8103"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8103/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  search-service:
    build:
      context: ./services/search-service
      dockerfile: Dockerfile
    container_name: food-delivery-search-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8104
      ELASTICSEARCH_URI: http://elasticsearch:9200
      SEARCH_CATALOG_INDEX: ${SEARCH_CATALOG_INDEX:-catalog_items_v1}
      SEARCH_RESTAURANT_INDEX: ${SEARCH_RESTAURANT_INDEX:-restaurants_v1}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CATALOG_EVENTS_TOPIC: ${CATALOG_EVENTS_TOPIC:-catalog.events}
      CATALOG_EVENTS_DLT_TOPIC: ${CATALOG_EVENTS_DLT_TOPIC:-catalog.events.dlt}
      CATALOG_EVENTS_DLT_TOPIC_PARTITIONS: ${CATALOG_EVENTS_DLT_TOPIC_PARTITIONS:-3}
      CATALOG_EVENTS_DLT_TOPIC_REPLICATION_FACTOR: ${CATALOG_EVENTS_DLT_TOPIC_REPLICATION_FACTOR:-1}
      SEARCH_CATALOG_CONSUMER_GROUP: ${SEARCH_CATALOG_CONSUMER_GROUP:-search-service-catalog-indexer}
      RESTAURANT_EVENTS_TOPIC: ${RESTAURANT_EVENTS_TOPIC:-restaurant.events}
      RESTAURANT_EVENTS_DLT_TOPIC: ${RESTAURANT_EVENTS_DLT_TOPIC:-restaurant.events.dlt}
      RESTAURANT_EVENTS_DLT_TOPIC_PARTITIONS: ${RESTAURANT_EVENTS_DLT_TOPIC_PARTITIONS:-3}
      RESTAURANT_EVENTS_DLT_TOPIC_REPLICATION_FACTOR: ${RESTAURANT_EVENTS_DLT_TOPIC_REPLICATION_FACTOR:-1}
      SEARCH_RESTAURANT_CONSUMER_GROUP: ${SEARCH_RESTAURANT_CONSUMER_GROUP:-search-service-restaurant-indexer}
      SEARCH_KAFKA_RETRY_MAX_ATTEMPTS: ${SEARCH_KAFKA_RETRY_MAX_ATTEMPTS:-3}
      SEARCH_KAFKA_RETRY_BACKOFF_MS: ${SEARCH_KAFKA_RETRY_BACKOFF_MS:-1000}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: search-service
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/food-delivery
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/food-delivery/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-food-delivery-api}
    ports:
      - "${SEARCH_SERVICE_PORT:-8104}:8104"
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8104/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  cart-service:
    build:
      context: ./services/cart-service
      dockerfile: Dockerfile
    container_name: food-delivery-cart-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8105
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CART_TTL: ${CART_TTL:-7d}
      CART_CAS_MAX_RETRIES: ${CART_CAS_MAX_RETRIES:-3}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: cart-service
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/food-delivery
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/food-delivery/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-food-delivery-api}
    ports:
      - "${CART_SERVICE_PORT:-8105}:8105"
    depends_on:
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      user-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8105/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: food-delivery-order-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8106
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: order-service
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/food-delivery
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/food-delivery/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-food-delivery-api}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    ports:
      - "${ORDER_SERVICE_PORT:-8106}:8106"
    depends_on:
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8106/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: food-delivery-payment-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8109
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: payment-service
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/food-delivery
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/food-delivery/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-food-delivery-api}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      PAYMENT_MOCK_WEBHOOK_SECRET: ${PAYMENT_MOCK_WEBHOOK_SECRET:-dev-mock-secret}
    ports:
      - "${PAYMENT_SERVICE_PORT:-8109}:8109"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8109/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  delivery-service:
    build:
      context: ./services/delivery-service
      dockerfile: Dockerfile
    container_name: food-delivery-delivery-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8107
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/delivery_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: delivery-service
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/food-delivery
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/food-delivery/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-food-delivery-api}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DELIVERY_VIETMAP_SERVICE_KEY: ${DELIVERY_VIETMAP_SERVICE_KEY:-}
      DELIVERY_VIETMAP_API_BASE_URL: ${DELIVERY_VIETMAP_API_BASE_URL:-https://maps.vietmap.vn}
      DELIVERY_VIETMAP_DISPLAY_TYPE: ${DELIVERY_VIETMAP_DISPLAY_TYPE:-5}
      DELIVERY_VIETMAP_ROUTE_VEHICLE: ${DELIVERY_VIETMAP_ROUTE_VEHICLE:-car}
      DELIVERY_QUOTE_TTL: ${DELIVERY_QUOTE_TTL:-5m}
      DELIVERY_CHECKOUT_LOCATION_TTL: ${DELIVERY_CHECKOUT_LOCATION_TTL:-45m}
      DELIVERY_QUOTE_CURRENCY: ${DELIVERY_QUOTE_CURRENCY:-VND}
      DELIVERY_BASE_FEE: ${DELIVERY_BASE_FEE:-15000}
      DELIVERY_INCLUDED_DISTANCE_METERS: ${DELIVERY_INCLUDED_DISTANCE_METERS:-3000}
      DELIVERY_FEE_PER_KM: ${DELIVERY_FEE_PER_KM:-5000}
      DELIVERY_MAXIMUM_SERVICE_DISTANCE_METERS: ${DELIVERY_MAXIMUM_SERVICE_DISTANCE_METERS:-10000}
      DELIVERY_PRICING_POLICY_VERSION: ${DELIVERY_PRICING_POLICY_VERSION:-dev-v1}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    ports:
      - "${DELIVERY_SERVICE_PORT:-8107}:8107"
    depends_on:
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8107/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  driver-service:
    build:
      context: ./services/driver-service
      dockerfile: Dockerfile
    container_name: food-delivery-driver-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8108
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/driver_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: driver-service
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/food-delivery
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/food-delivery/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-food-delivery-api}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    ports:
      - "${DRIVER_SERVICE_PORT:-8108}:8108"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8108/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  tracking-service:
    build:
      context: ./services/tracking-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8111
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: tracking-service
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/food-delivery
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/food-delivery/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-food-delivery-api}
      DRIVER_LOCATION_STALE_AFTER: ${DRIVER_LOCATION_STALE_AFTER:-45s}
      DRIVER_LOCATION_MAX_ACCURACY_METERS: ${DRIVER_LOCATION_MAX_ACCURACY_METERS:-100}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    ports:
      - "${TRACKING_SERVICE_PORT:-8111}:8111"
    depends_on:
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      driver-service:
        condition: service_healthy
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8111/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: food-delivery-notification-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8112
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: notification-service
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/food-delivery
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/food-delivery/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-food-delivery-api}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      EXPO_PUSH_BASE_URL: ${EXPO_PUSH_BASE_URL:-https://exp.host/--/api/v2}
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8112}:8112"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8112/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

networks:
  food-delivery-network:
    name: food-delivery-network
    driver: bridge

volumes:
  postgres_data:
    external: true
    name: food_delivery_microservices_postgres_data
  elasticsearch_data:
  redis_data:
